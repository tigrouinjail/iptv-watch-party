<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regardons Ensemble • V12 OTT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; }
        .channel-item { transition: all 0.2s; }
        .channel-item:hover { background: rgba(255,255,255,0.1); }
        .channel-item.active { background: #e11d48; }
    </style>
</head>
<body>
    <div class="max-w-6xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Regardons Ensemble</h1>
            <button onclick="toggleAdmin()" class="px-4 py-2 bg-white/10 rounded-2xl text-sm flex items-center gap-x-2">
                <i class="fa-solid fa-user-shield"></i>
                <span>Mode Admin</span>
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- VIDEO -->
            <div class="lg:col-span-8">
                <div class="bg-black rounded-3xl overflow-hidden aspect-video">
                    <video id="video" class="w-full h-full" controls></video>
                </div>
                <div id="title" class="text-center mt-4 text-2xl font-semibold"></div>
            </div>

            <!-- ADMIN PANEL -->
            <div class="lg:col-span-4">
                <div id="adminPanel" class="hidden glass p-5 rounded-3xl">
                    <h3 class="font-bold mb-4">Panel Admin - Xtream</h3>

                    <div class="space-y-2 mb-4">
                        <input id="host" value="http://2970702.fluxitv.top" class="w-full p-2 rounded bg-black/40 text-sm" placeholder="Host">
                        <input id="username" value="K97Z86M9" class="w-full p-2 rounded bg-black/40 text-sm" placeholder="Username">
                        <input id="password" value="URGNZY" class="w-full p-2 rounded bg-black/40 text-sm" placeholder="Password" type="password">
                        
                        <button onclick="loginXtream()" class="w-full bg-rose-600 py-2.5 rounded font-semibold">
                            Se connecter &amp; Charger les chaînes
                        </button>
                    </div>

                    <div id="channelList" class="max-h-[400px] overflow-y-auto space-y-1 text-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let channels = [];
        let currentChannel = null;
        let video = document.getElementById('video');

        function toggleAdmin() {
            document.getElementById('adminPanel').classList.toggle('hidden');
        }

        async function loginXtream() {
            const host = document.getElementById('host').value.trim().replace(/\/$/, '');
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value.trim();

            if (!host || !username || !password) {
                alert('Veuillez remplir Host, Username et Password');
                return;
            }

            const authUrl = `${host}/player_api.php?username=${username}&password=${password}`;
            const proxyAuth = 'https://corsproxy.io/?' + encodeURIComponent(authUrl);

            try {
                const res = await fetch(proxyAuth);
                const data = await res.json();

                if (!data.user_info || data.user_info.auth !== 1) {
                    alert('Identifiants incorrects ou compte expiré');
                    return;
                }

                const streamsUrl = `${host}/player_api.php?username=${username}&password=${password}&action=get_live_streams`;
                const proxyStreams = 'https://corsproxy.io/?' + encodeURIComponent(streamsUrl);

                const streamsRes = await fetch(proxyStreams);
                const streams = await streamsRes.json();

                channels = streams.map(s => ({
                    name: s.name,
                    url: `${host}/live/${username}/${password}/${s.stream_id}.ts`
                }));

                renderChannelList();

            } catch (e) {
                alert('Erreur lors de la connexion Xtream. Essaie de coller le fichier .m3u manuellement.');
                console.error(e);
            }
        }

        function renderChannelList() {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            channels.forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-item p-2 rounded cursor-pointer';
                div.innerHTML = ch.name;
                div.onclick = () => playChannel(ch);
                container.appendChild(div);
            });
        }

        function playChannel(ch) {
            currentChannel = ch;
            loadVideo(ch.url, ch.name);
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function loadVideo(url, title) {
            if (!url) return;
            if (Hls.isSupported() && url.includes('.m3u8')) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else {
                video.src = url;
            }
            document.getElementById('title').innerText = title;
        }

        function copyViewerLink() {
            if (!currentChannel) return alert('Aucune chaîne sélectionnée');
            const link = location.origin + location.pathname + '?stream=' + encodeURIComponent(currentChannel.url) + '&title=' + encodeURIComponent(currentChannel.name);
            navigator.clipboard.writeText(link);
            alert('Lien spectateurs copié !');
        }

        function initFromURL() {
            const params = new URLSearchParams(location.search);
            const stream = params.get('stream');
            const title = params.get('title');
            if (stream) {
                loadVideo(stream, title || '');
            }
        }

        window.onload = () => {
            initFromURL();
        };
    </script>
</body>
</html>
