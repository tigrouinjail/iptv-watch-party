<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regardons Ensemble • IPTV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { font-family: system-ui, sans-serif; background: #0f172a; color: white; }
        .cinema { background: linear-gradient(135deg, #0f172a, #1e1135); }
        video { background: black; }
    </style>
</head>
<body class="cinema min-h-screen">
    <div class="max-w-5xl mx-auto p-6">
        <!-- Header -->
        <div class="flex items-center justify-between mb-6">
            <div class="flex items-center gap-x-3">
                <div class="w-10 h-10 bg-rose-600 rounded-2xl flex items-center justify-center">
                    <i class="fa-solid fa-tv text-white text-2xl"></i>
                </div>
                <h1 class="text-3xl font-bold">Regardons Ensemble</h1>
            </div>
            <button onclick="toggleAdmin()" 
                    class="px-5 py-2 bg-white/10 hover:bg-white/20 rounded-2xl flex items-center gap-x-2 text-sm">
                <i class="fa-solid fa-user-shield"></i>
                <span>Mode Admin</span>
            </button>
        </div>

        <!-- Video Player -->
        <div class="bg-black rounded-3xl overflow-hidden shadow-2xl mb-6 aspect-video">
            <video id="video" class="w-full h-full" controls playsinline></video>
        </div>

        <!-- Current Info -->
        <div id="info" class="mb-6 text-center">
            <div id="currentTitle" class="text-2xl font-semibold mb-1">Aucun contenu diffusé</div>
            <div id="currentUrl" class="text-xs text-white/40 font-mono break-all"></div>
        </div>

        <!-- ADMIN PANEL -->
        <div id="adminPanel" class="hidden max-w-2xl mx-auto bg-white/5 border border-white/10 rounded-3xl p-6">
            <h2 class="text-xl font-bold mb-4 flex items-center gap-x-2">
                <i class="fa-solid fa-crown text-rose-400"></i> 
                Panel Admin
            </h2>
            
            <div class="space-y-4">
                <div>
                    <label class="block text-sm mb-1 text-white/70">URL du flux (.m3u8)</label>
                    <input id="streamUrl" type="text" placeholder="https://exemple.com/stream.m3u8"
                           class="w-full bg-black/40 border border-white/20 px-4 py-3 rounded-2xl text-sm">
                </div>
                
                <div>
                    <label class="block text-sm mb-1 text-white/70">Titre du programme</label>
                    <input id="streamTitle" type="text" placeholder="Match du soir"
                           class="w-full bg-black/40 border border-white/20 px-4 py-3 rounded-2xl text-sm">
                </div>
                
                <button onclick="setStream()" 
                        class="w-full bg-rose-600 hover:bg-rose-500 py-3 rounded-2xl font-semibold flex items-center justify-center gap-x-2">
                    <i class="fa-solid fa-play"></i>
                    <span>DIFFUSER CE PROGRAMME</span>
                </button>
            </div>
            
            <div class="mt-4 pt-4 border-t border-white/10">
                <button onclick="copyViewerLink()" 
                        class="w-full bg-white/10 hover:bg-white/20 py-3 rounded-2xl text-sm flex items-center justify-center gap-x-2">
                    <i class="fa-solid fa-link"></i>
                    <span>Copier le lien spectateurs</span>
                </button>
            </div>
        </div>
    </div>

    <script>
        const video = document.getElementById('video');
        let hls = null;

        // Simple admin password (change it if you want)
        const ADMIN_PASSWORD = "admin123";

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            if (panel.classList.contains('hidden')) {
                const pass = prompt("Mot de passe Admin :");
                if (pass === ADMIN_PASSWORD) {
                    panel.classList.remove('hidden');
                } else {
                    alert("Mot de passe incorrect");
                }
            } else {
                panel.classList.add('hidden');
            }
        }

        function loadStream(url, title = "") {
            if (hls) {
                hls.destroy();
                hls = null;
            }
            video.src = "";

            const isHLS = url.includes('.m3u8');

            if (isHLS && Hls.isSupported()) {
                hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else {
                video.src = url;
            }

            // Update UI
            document.getElementById('currentTitle').textContent = title || "Contenu diffusé";
            document.getElementById('currentUrl').textContent = url.length > 80 ? url.substring(0, 77) + "..." : url;

            video.play().catch(() => {});
        }

        function setStream() {
            const url = document.getElementById('streamUrl').value.trim();
            const title = document.getElementById('streamTitle').value.trim();

            if (!url) {
                alert("Veuillez entrer une URL de flux");
                return;
            }

            loadStream(url, title);
            
            // Save in URL so it persists when sharing
            const params = new URLSearchParams();
            params.set('stream', url);
            if (title) params.set('title', title);
            window.history.replaceState({}, '', '?' + params.toString());
        }

        function copyViewerLink() {
            const url = document.getElementById('streamUrl').value.trim();
            const title = document.getElementById('streamTitle').value.trim();
            
            if (!url) {
                alert("Aucun flux à partager");
                return;
            }

            const params = new URLSearchParams();
            params.set('stream', url);
            if (title) params.set('title', title);
            
            const link = window.location.origin + window.location.pathname + '?' + params.toString();
            navigator.clipboard.writeText(link).then(() => {
                alert("Lien spectateurs copié !\n\n" + link);
            });
        }

        // Auto-load stream from URL parameters (for viewers)
        function initFromURL() {
            const params = new URLSearchParams(window.location.search);
            const stream = params.get('stream');
            const title = params.get('title');

            if (stream) {
                loadStream(stream, title || "");
            }
        }

        // Initialize
        window.onload = function() {
            initFromURL();
            
            // Easter egg: press "a" to quickly open admin
            document.addEventListener('keydown', function(e) {
                if (e.key.toLowerCase() === 'a') {
                    const panel = document.getElementById('adminPanel');
                    if (panel.classList.contains('hidden')) {
                        const pass = prompt("Mot de passe Admin :");
                        if (pass === ADMIN_PASSWORD) panel.classList.remove('hidden');
                    }
                }
            });
        };
    </script>
</body>
</html>
