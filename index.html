<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regardons Ensemble • V12 OTT</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        body { background: #0f172a; color: white; }
        .channel-item { transition: all 0.2s; }
        .channel-item:hover { background: rgba(255,255,255,0.1); }
        .channel-item.active { background: #e11d48; }
    </style>
</head>
<body>
    <div class="max-w-6xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Regardons Ensemble</h1>
            <button onclick="toggleAdmin()" class="px-4 py-2 bg-white/10 rounded-2xl text-sm flex items-center gap-x-2">
                <i class="fa-solid fa-user-shield"></i>
                <span>Mode Admin</span>
            </button>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <!-- VIDEO -->
            <div class="lg:col-span-8">
                <div class="bg-black rounded-3xl overflow-hidden aspect-video">
                    <video id="video" class="w-full h-full" controls></video>
                </div>
                <div id="title" class="text-center mt-4 text-2xl font-semibold"></div>
            </div>

            <!-- CHANNEL LIST -->
            <div class="lg:col-span-4">
                <div id="adminPanel" class="hidden glass p-5 rounded-3xl">
                    <h3 class="font-bold mb-3">Panel Admin</h3>
                    
                    <div class="mb-3">
                        <input id="m3uUrl" value="http://2970702.fluxitv.top/get.php?username=K97Z86M9&password=URGNZY&type=m3u&output=mpegts" class="w-full p-2 rounded bg-black/40 text-sm mb-2">
                        <button onclick="loadPlaylist()" class="w-full bg-rose-600 py-2 rounded text-sm font-semibold">Charger ma playlist</button>
                    </div>

                    <div id="channelList" class="max-h-[450px] overflow-y-auto space-y-1 text-sm"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let channels = [];
        let currentChannel = null;
        let video = document.getElementById('video');

        function toggleAdmin() {
            const panel = document.getElementById('adminPanel');
            panel.classList.toggle('hidden');
        }

        async function loadPlaylist() {
            const url = document.getElementById('m3uUrl').value;
            try {
                const res = await fetch('https://corsproxy.io/?' + encodeURIComponent(url));
                const text = await res.text();
                channels = parseM3U(text);
                renderChannels();
            } catch (e) {
                alert('Erreur de chargement. Colle le contenu du fichier .m3u directement.');
            }
        }

        function parseM3U(content) {
            const lines = content.split('\n');
            const result = [];
            let name = '';
            for (let line of lines) {
                line = line.trim();
                if (line.startsWith('#EXTINF:')) {
                    const m = line.match(/,(.+)$/);
                    name = m ? m[1] : 'Chaîne';
                } else if (line && !line.startsWith('#')) {
                    result.push({ name, url: line });
                }
            }
            return result;
        }

        function renderChannels() {
            const container = document.getElementById('channelList');
            container.innerHTML = '';
            channels.forEach(ch => {
                const div = document.createElement('div');
                div.className = 'channel-item p-2 rounded cursor-pointer';
                div.innerHTML = ch.name;
                div.onclick = () => playChannel(ch);
                container.appendChild(div);
            });
        }

        function playChannel(ch) {
            currentChannel = ch;
            loadVideo(ch.url, ch.name);
            document.querySelectorAll('.channel-item').forEach(el => el.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function loadVideo(url, title) {
            if (!url) return;
            const isHLS = url.includes('.m3u8');
            if (isHLS && Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else {
                video.src = url;
            }
            document.getElementById('title').innerText = title;
        }

        function copyLink() {
            if (!currentChannel) return alert('Aucune chaîne sélectionnée');
            const link = location.origin + location.pathname + '?stream=' + encodeURIComponent(currentChannel.url) + '&title=' + encodeURIComponent(currentChannel.name);
            navigator.clipboard.writeText(link);
            alert('Lien copié ! Envoie-le à tes spectateurs.');
        }

        // Load from URL if shared
        function initFromURL() {
            const params = new URLSearchParams(location.search);
            const stream = params.get('stream');
            const title = params.get('title');
            if (stream) {
                loadVideo(stream, title);
                document.getElementById('title').innerText = title || '';
            }
        }

        window.onload = () => {
            initFromURL();
        };
    </script>
</body>
</html>
