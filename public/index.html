<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Regardons Ensemble • IPTV</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
    <script src="/socket.io/socket.io.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style> body { background: #0f172a; color: white; } .glass { background: rgba(255,255,255,0.08); } </style>
</head>
<body>
    <div class="max-w-6xl mx-auto p-6">
        <div class="flex justify-between items-center mb-6">
            <h1 class="text-3xl font-bold">Regardons Ensemble</h1>
            <div id="roomInfo" class="text-sm"></div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
            <div class="lg:col-span-8">
                <div class="bg-black rounded-3xl overflow-hidden aspect-video">
                    <video id="video" class="w-full h-full" controls></video>
                </div>
                <div id="contentTitle" class="text-center mt-4 text-2xl font-semibold"></div>
            </div>

            <div class="lg:col-span-4">
                <div id="adminPanel" class="hidden glass p-5 rounded-3xl">
                    <h3 class="font-bold mb-3">Panel Admin</h3>
                    <input id="streamUrl" placeholder="URL m3u8 ou stream" class="w-full p-3 rounded bg-black/40 mb-2">
                    <input id="contentTitleInput" placeholder="Titre du programme" class="w-full p-3 rounded bg-black/40 mb-3">
                    <button onclick="changeStream()" class="w-full bg-rose-600 py-3 rounded font-semibold">Diffuser</button>
                </div>

                <div class="glass p-5 rounded-3xl mt-4">
                    <h3 class="font-bold mb-3">Participants</h3>
                    <div id="participantsList"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let currentRoomId = null;
        let isHost = false;
        let video = document.getElementById('video');

        function createRoom() {
            const username = prompt("Ton pseudo (Admin)");
            socket.emit('create-room', { username });
        }

        function joinRoom(roomId) {
            const username = prompt("Ton pseudo");
            socket.emit('join-room', { roomId, username });
        }

        socket.on('room-created', (data) => {
            currentRoomId = data.roomId;
            isHost = true;
            document.getElementById('roomInfo').innerHTML = `Salle : <b>${data.roomId}</b> (Admin)`;
            document.getElementById('adminPanel').classList.remove('hidden');
        });

        socket.on('room-joined', (data) => {
            currentRoomId = data.roomId;
            isHost = data.isHost;
            if (data.streamUrl) loadStream(data.streamUrl, data.contentTitle);
        });

        socket.on('stream-changed', (data) => {
            loadStream(data.streamUrl, data.contentTitle);
        });

        function changeStream() {
            if (!isHost || !currentRoomId) return;
            const url = document.getElementById('streamUrl').value;
            const title = document.getElementById('contentTitleInput').value;
            socket.emit('change-stream', { roomId: currentRoomId, streamUrl: url, contentTitle: title });
        }

        function loadStream(url, title) {
            if (!url) return;
            const isHLS = url.includes('.m3u8');
            if (isHLS && Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
            } else {
                video.src = url;
            }
            document.getElementById('contentTitle').innerText = title || '';
        }

        // Auto create room for demo
        window.onload = () => {
            // For demo, auto create room
            setTimeout(() => {
                if (!currentRoomId) createRoom();
            }, 500);
        };
    </script>
</body>
</html>
